<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --green: #1a6b3a;
    --green-light: #e6f4ec;
    --green-mid: #2d8a50;
    --white: #ffffff;
    --text: #1e1e1e;
    --border: #e0e0e0;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Outfit', sans-serif;
    background: transparent;
    padding: 12px;
  }
  .wrapper {
    background: var(--white);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.09);
  }
  .header {
    background: var(--green);
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .header h2 { color: #fff; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
  }
  .item {
    background: var(--white);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 8px 12px;
    text-decoration: none;
    color: var(--text);
    gap: 7px;
    transition: background 0.16s, transform 0.15s;
    position: relative;
    overflow: hidden;
  }
  .item::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: var(--green);
    transform: scaleX(0);
    transition: transform 0.2s ease;
  }
  .item:hover { background: var(--green-light); transform: translateY(-2px); }
  .item:hover::after { transform: scaleX(1); }
  .icon {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--green-light);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.16s;
  }
  .item:hover .icon { background: var(--green); }
  .icon svg { width: 18px; height: 18px; stroke: var(--green); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.16s; }
  .item:hover .icon svg { stroke: #fff; }
  .label { font-size: 10.5px; font-weight: 600; color: #333; text-align: center; line-height: 1.3; }
</style>
</head>
