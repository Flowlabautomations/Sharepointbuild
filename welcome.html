<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --green: #1a6b3a;
    --green-mid: #2d8a50;
    --green-light: #e6f4ec;
    --white: #ffffff;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Outfit', sans-serif; background: transparent; padding: 0; margin: 0; }

  .banner {
    background: var(--green);
    border-radius: 0;
    padding: 28px 40px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(26,107,58,0.3);
  }

  /* Decorative circles */
  .banner::before {
    content: '';
    position: absolute;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    top: -60px; right: -40px;
  }
  .banner::after {
    content: '';
    position: absolute;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    bottom: -40px; right: 120px;
  }

  .inner { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }

  .left {}
  .greeting { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.75); letter-spacing: 0.04em; margin-bottom: 4px; }
  .name { font-size: 28px; font-weight: 800; color: #ffffff; line-height: 1.1; }
  .subtitle { font-size: 12.5px; color: rgba(255,255,255,0.65); margin-top: 6px; font-weight: 400; }

  .right { display: flex; gap: 10px; flex-wrap: wrap; }
  .badge {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 11.5px;
    font-weight: 600;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: background 0.15s;
    text-decoration: none;
  }
  .badge:hover { background: rgba(255,255,255,0.22); }
  .badge svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .divider { height: 1px; background: rgba(255,255,255,0.15); margin: 16px 0; position: relative; z-index: 1; }

  .bottom { position: relative; z-index: 1; display: flex; gap: 20px; flex-wrap: wrap; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-val { font-size: 18px; font-weight: 800; color: #fff; }
  .stat-lbl { font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 0.06em; }
  .stat-sep { width: 1px; background: rgba(255,255,255,0.2); align-self: stretch; }
</style>
</head>
<body>
<div class="banner">
  <div class="inner">
    <div class="left">
      <div class="greeting">Welcome back 👋</div>
      <div class="name">KZNEDTEA Intranet</div>
      <div class="subtitle">KwaZulu-Natal Economic Development, Tourism &amp; Environmental Affairs</div>
    </div>
    <div class="right">
      <a class="badge" href="#">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        Helpdesk
      </a>
      <a class="badge" href="#">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        Directory
      </a>
      <a class="badge" href="#">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Events
      </a>
    </div>
  </div>
  <div class="divider"></div>
  <div class="bottom">
    <div class="stat">
      <span class="stat-val">03/2026</span>
      <span class="stat-lbl">Current Period</span>
    </div>
    <div class="stat-sep"></div>
    <div class="stat">
      <span class="stat-val">Q1</span>
      <span class="stat-lbl">Quarter</span>
    </div>
    <div class="stat-sep"></div>
    <div class="stat">
      <span class="stat-val">42</span>
      <span class="stat-lbl">Active Projects</span>
    </div>
    <div class="stat-sep"></div>
    <div class="stat">
      <span class="stat-val">8</span>
      <span class="stat-lbl">Upcoming Events</span>
    </div>
  </div>
</div>
</body>
</html>
